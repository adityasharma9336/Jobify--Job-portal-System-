# ─── Admin Panel Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobify-admin
  namespace: jobify
  labels:
    app.kubernetes.io/name: jobify
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobify-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jobify-admin
    spec:
      containers:
        - name: admin
          image: adityasharma9336/jobify-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
# ─── Admin Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: jobify
  labels:
    app.kubernetes.io/name: jobify
    app.kubernetes.io/component: admin
spec:
  selector:
    app: jobify-admin
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
