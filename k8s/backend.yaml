apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobify-backend
  template:
    metadata:
      labels:
        app: jobify-backend
    spec:
      containers:
      - name: backend
        image: your-dockerhub-username/jobify-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/jobify"
        - name: JWT_SECRET
          value: "your_jwt_secret"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: jobify-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
