apiVersion: v1
kind: Secret
metadata:
  name: jobify-secrets
  namespace: jobify
  labels:
    app.kubernetes.io/name: jobify
type: Opaque
stringData:
  # ⚠️  IMPORTANT: Replace these values before applying to production!
