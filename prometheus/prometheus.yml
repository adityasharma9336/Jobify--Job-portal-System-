global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'jobify-monitor'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Jobify backend — uses Docker Compose service name
  - job_name: 'jobify-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'jobify-backend'

  # Node Exporter (optional — if you add it later)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
